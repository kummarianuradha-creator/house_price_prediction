<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
</head>
<body>

    <h2>House Price Prediction Website</h2>

    <form action="/predict" method="post">

        <label>Area (in square feet):</label><br>
        <input type="number" name="area" required><br><br>

        <label>Number of Bedrooms:</label><br>
        <input type="number" name="bedrooms" required><br><br>

        <label>Number of Bathrooms:</label><br>
        <input type="number" name="bathrooms" required><br><br>

        <button type="submit">Predict Price</button>

    </form>

    <h3>{{ prediction_text }}</h3>

</body>
</html>
